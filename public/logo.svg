<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="payGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Shield & Key) -->
  <g transform="translate(14, 14)">
    <!-- Outer Glow -->
    <path d="M36 6 C 56 6, 68 18, 68 34 C 68 56, 44 68, 36 72 C 28 68, 4 56, 4 34 C 4 18, 16 6, 36 6 Z" fill="url(#shieldGrad)" opacity="0.3" filter="url(#glow)"/>
    
    <!-- Shield Base -->
    <path d="M36 6 C 54 6, 66 17, 66 33 C 66 54, 43 66, 36 70 C 29 66, 6 54, 6 33 C 6 17, 18 6, 36 6 Z" fill="url(#shieldGrad)" />
    
    <!-- Shield Inner Shadow Detail -->
    <path d="M36 10 C 50 10, 60 19, 60 32 C 60 49, 41 59, 36 63 C 31 59, 12 49, 12 32 C 12 19, 22 10, 36 10 Z" fill="#0B132B" opacity="0.4" />
    
    <!-- Digital Key Emblem inside Shield -->
    <!-- Key Bow / Ring -->
    <circle cx="36" cy="27" r="10" stroke="url(#keyGrad)" stroke-width="4" fill="none" />
    <circle cx="36" cy="27" r="4.5" fill="url(#keyGrad)" />
    
    <!-- Key Stem & Bits -->
    <path d="M36 37 L36 54 M36 45 L43 45 M36 50 L41 50" stroke="url(#keyGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <text x="105" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">
    KeyTrust
  </text>
  
  <!-- "Pay" Pill Badge -->
  <g transform="translate(254, 30)">
    <rect width="64" height="32" rx="8" fill="url(#payGrad)" />
    <text x="32" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="16" font-weight="800" fill="#070B14" text-anchor="middle" letter-spacing="0.04em">PAY</text>
  </g>
</svg>
